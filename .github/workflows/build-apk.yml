name: Build Signature Studio Pro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare app
        run: |
          mkdir -p app
          cp signature-studio-pro-no-eraser.html app/index.html
          cd app
          zip -r ../signature-studio-pro-web.zip index.html

      - name: Upload app package
        uses: actions/upload-artifact@v4
        with:
          name: signature-studio-pro-web
          path: signature-studio-pro-web.zip
